name: Merge
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
      - '.editorconfig'
  workflow_dispatch:

concurrency:
  group: lab-merge-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      skip_build: ${{ steps.matrix.outputs.skip_build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
      - uses: Novolis-Platform/novolis-workflows/actions/setup-dotnet@main
        with:
          dotnet-version: 10.0.x
      - name: Validate labs manifest
        run: dotnet run --project tools/LabsManifest/LabsManifest.csproj --no-launch-profile -- validate --repo "$GITHUB_WORKSPACE"
      - name: Resolve changed-lab matrix
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            dotnet run --project tools/LabsManifest/LabsManifest.csproj --no-launch-profile -- \
              ci-matrix --repo "$GITHUB_WORKSPACE" --all > /tmp/matrix.json
          else
            before="${{ github.event.before }}"
            if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
              dotnet run --project tools/LabsManifest/LabsManifest.csproj --no-launch-profile -- \
                ci-matrix --repo "$GITHUB_WORKSPACE" --all > /tmp/matrix.json
            else
              git diff --name-only "$before...${{ github.sha }}" > /tmp/changed-files.txt || true
              dotnet run --project tools/LabsManifest/LabsManifest.csproj --no-launch-profile -- \
                ci-matrix --repo "$GITHUB_WORKSPACE" --changed-files /tmp/changed-files.txt \
                > /tmp/matrix.json
            fi
          fi
          echo "matrix=$(jq -c '.include' /tmp/matrix.json)" >> "$GITHUB_OUTPUT"
          echo "skip_build=$(jq -r '.skip_build' /tmp/matrix.json)" >> "$GITHUB_OUTPUT"
          cat /tmp/matrix.json

  build:
    needs: detect
    if: needs.detect.outputs.skip_build != 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Checkout governance build targets
        shell: bash
        run: |
          set -euo pipefail
          gov="../novolis-governance"
          if [ ! -f "$gov/build/Novolis.Packaging.targets" ]; then
            git clone --depth 1 --branch main \
              "https://github.com/${GITHUB_REPOSITORY_OWNER}/novolis-governance.git" "$gov"
          fi
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
      - uses: Novolis-Platform/novolis-workflows/actions/setup-dotnet@main
        with:
          dotnet-version: 10.0.x
      - name: Install required MAUI workloads
        shell: bash
        env:
          PROJECTS_JSON: ${{ toJson(matrix.projects) }}
        run: |
          set -euo pipefail
          needs_android=0
          needs_windows=0
          while IFS= read -r project; do
            [ -n "$project" ] || continue
            if [[ "$project" == *[Aa]ndroid* ]] || { [ -f "$project" ] && grep -q -- '-android' "$project"; }; then
              needs_android=1
            fi
            if [ -f "$project" ] \
              && grep -Eq '<UseMaui>[[:space:]]*true[[:space:]]*</UseMaui>' "$project" \
              && grep -q -- '-windows' "$project"; then
              needs_windows=1
            fi
          done < <(jq -r '.[]' <<< "$PROJECTS_JSON" | tr -d '\r')
          if [ "$needs_android" = 1 ]; then
            dotnet workload install android
          fi
          if [ "$needs_windows" = 1 ]; then
            dotnet workload install maui-windows
          fi
      - uses: Novolis-Platform/novolis-workflows/actions/authenticate-github-packages@main
        with:
          token: ${{ github.token }}
      - name: Restore and build changed lab
        shell: bash
        env:
          PROJECTS_JSON: ${{ toJson(matrix.projects) }}
        run: |
          set -euo pipefail
          while IFS= read -r project; do
            [ -n "$project" ] || continue
            dotnet restore "$project"
            dotnet build "$project" --no-restore -c Release
          done < <(jq -r '.[]' <<< "$PROJECTS_JSON" | tr -d '\r')
      - name: Test changed lab scope
        shell: bash
        env:
          TESTS_JSON: ${{ toJson(matrix.tests) }}
        run: |
          set -euo pipefail
          while IFS= read -r test; do
            [ -n "$test" ] || continue
            dotnet test "$test" -c Release
          done < <(jq -r '.[]' <<< "$TESTS_JSON" | tr -d '\r')
