name: PulseStrip smoke
on:
  pull_request:
    paths:
      - 'labs/raylib/PulseStrip/**'
      - 'labs/raylib/PulseStrip.Core/**'
      - 'labs/raylib/PulseStrip.Tests/**'
      - '.github/workflows/pulsestrip-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'labs/raylib/PulseStrip/**'
      - 'labs/raylib/PulseStrip.Core/**'
      - 'labs/raylib/PulseStrip.Tests/**'
      - '.github/workflows/pulsestrip-smoke.yml'
  workflow_dispatch:
concurrency:
  group: pulsestrip-smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: Novolis-Platform/novolis-workflows/actions/setup-dotnet@main
        with:
          dotnet-version: '10.0.x'
      - uses: Novolis-Platform/novolis-workflows/actions/authenticate-github-packages@main
        with:
          token: ${{ github.token }}
      - name: Test Core
        run: dotnet test labs/raylib/PulseStrip.Tests/PulseStrip.Tests.csproj --configuration Release
      - name: Build game
        run: dotnet build labs/raylib/PulseStrip/PulseStrip.csproj --configuration Release
      - name: Headless smoke
        env:
          NOVOLIS_RAYLIB_HEADLESS: '1'
        run: dotnet run --project labs/raylib/PulseStrip/PulseStrip.csproj --configuration Release --no-build -- --smoke
